<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2247"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagon background -->
  <polygon points="50,3 91,26 91,74 50,97 9,74 9,26"
           fill="url(#bg)"/>

  <!-- Hexagon border (outer glow) -->
  <polygon points="50,3 91,26 91,74 50,97 9,74 9,26"
           fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>

  <!-- Hexagon border (main) -->
  <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"
           fill="none" stroke="url(#border)" stroke-width="2.5"/>

  <!-- Corner circuit dots -->
  <circle cx="50" cy="5"    r="3" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="89" cy="27.5" r="2.5" fill="#f0b429" filter="url(#glow)"/>
  <circle cx="89" cy="72.5" r="2.5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="50" cy="95"   r="3" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="11" cy="72.5" r="2.5" fill="#f0b429" filter="url(#glow)"/>
  <circle cx="11" cy="27.5" r="2.5" fill="#22d3ee" filter="url(#glow)"/>

  <!-- MB text -->
  <text x="50" y="64"
        font-family="Arial Black,Impact,system-ui"
        font-size="34" font-weight="900"
        fill="white" text-anchor="middle"
        letter-spacing="-1">MB</text>

  <!-- Small cyan underline accent -->
  <line x1="28" y1="70" x2="72" y2="70" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
</svg>
